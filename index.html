<style>
/* ========================================================= 🚀 核心變數引擎 ========================================================= */
:root { 
  --bg: #E8ECF1; --bg-card: #FFFFFF; --s-light: #FFFFFF; --s-dark: #B8C4D0; 
  --t-main: #1A2332; --t-muted: #6B7B8D; --up: #DC2626; --down: #16A34A; 
  --engrave-l: rgba(255,255,255,0.9); --engrave-d: rgba(0,0,0,0.12); 
  --protrude-l: rgba(255,255,255,1); --protrude-d: rgba(0,0,0,0.06); 
  --accent: #2563EB; --border-light: #D1D8E0; 
  --shadow-soft: 4px 4px 8px var(--s-dark), -4px -4px 8px var(--s-light);
  --shadow-strong: 6px 6px 14px var(--s-dark), -6px -6px 14px var(--s-light);
  --shadow-inset: inset 4px 4px 8px var(--s-dark), inset -4px -4px 8px var(--s-light);
}
body.tech { 
  --bg: #1E2330; --bg-card: #2D3344; --s-light: #2D3344; --s-dark: #151820; 
  --t-main: #F8FAFC; --t-muted: #94A3B8; --up: #FF5252; --down: #4ADE80; 
  --engrave-l: rgba(255,255,255,0.12); --engrave-d: rgba(0,0,0,0.5); 
  --protrude-l: rgba(255,255,255,0.18); --protrude-d: rgba(0,0,0,0.35); 
  --accent: #60A5FA; --border-light: #3D4556; 
  --shadow-soft: 4px 4px 8px var(--s-dark), -4px -4px 8px var(--s-light), 0 0 12px rgba(96, 165, 250, 0.4);
  --shadow-strong: 6px 6px 14px var(--s-dark), -6px -6px 14px var(--s-light), 0 0 24px rgba(96, 165, 250, 0.8);
  --shadow-inset: inset 4px 4px 8px var(--s-dark), inset -4px -4px 8px var(--s-light), inset 0 0 12px rgba(96, 165, 250, 0.4);
}
body.blue-light { 
  --bg: #D0DEE8; --bg-card: #E8F0F8; --s-light: #E8F0F8; --s-dark: #8CA0B8; 
  --t-main: #061220; --t-muted: #3A5A7A; --up: #DC2626; --down: #16A34A; 
  --engrave-l: rgba(255,255,255,0.95); --engrave-d: rgba(0,0,0,0.25); 
  --protrude-l: rgba(255,255,255,1); --protrude-d: rgba(0,0,0,0.15); 
  --accent: #1E40AF; --border-light: #A8B8C8; 
}
body.purple-light { 
  --bg: #EAE6EF; --bg-card: #FDFBFF; --s-light: #FDFBFF; --s-dark: #C9B8D5; 
  --t-main: #3D2D4D; --t-muted: #7A6A8C; --up: #D9465B; --down: #2D8A70; 
  --engrave-l: rgba(255,255,255,1); --engrave-d: rgba(0,0,0,0.10); 
  --protrude-l: rgba(255,255,255,1); --protrude-d: rgba(0,0,0,0.05); 
  --accent: #7A5CAF; --border-light: #D6C8E0; 
}
body.pink { 
  --bg: #F4E8EC; --bg-card: #FFFBFB; --s-light: #FFFBFB; --s-dark: #D4B8C1; 
  --t-main: #5C3241; --t-muted: #946574; --up: #D9465B; --down: #2D8A70; 
  --engrave-l: rgba(255,255,255,1); --engrave-d: rgba(0,0,0,0.08); 
  --protrude-l: rgba(255,255,255,1); --protrude-d: rgba(0,0,0,0.04); 
  --accent: #C24D7B; --border-light: #E6D0D8; 
}
body.brown-light { 
  --bg: #F5EFEA; --bg-card: #FDFBFA; --s-light: #FFFFFF; --s-dark: #D4C9C1; 
  --t-main: #4A2A17; --t-muted: #7A4526; --up: #D9465B; --down: #2D8A70; 
  --engrave-l: rgba(255,255,255,1); --engrave-d: rgba(122,69,38,0.15); 
  --protrude-l: rgba(255,255,255,1); --protrude-d: rgba(122,69,38,0.08); 
  --accent: #7A4526; --border-light: #E8DFD8; 
}
body.gray-light { 
  --bg: #BFC5CC; --bg-card: #D3D9E0; --s-light: #E5EBF2; --s-dark: #9199A3; 
  --t-main: #1D232A; --t-muted: #535C66; --up: #D9465B; --down: #2D8A70; 
  --engrave-l: rgba(255,255,255,0.6); --engrave-d: rgba(0,0,0,0.15); 
  --protrude-l: rgba(255,255,255,0.7); --protrude-d: rgba(0,0,0,0.12); 
  --accent: #373F47; --border-light: #A4ABB3; 
}

/* ========================================================= 🌐 基礎排版 ========================================================= */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Noto Sans TC,sans-serif; background:var(--bg); color:var(--t-main); padding:0 0 60px; min-height:100vh; font-size:15px; overflow-x:hidden; transition:background-color 0.4s ease, color 0.4s ease}
input,select,button{font-family:inherit;font-size:inherit;outline:none;text-align:center}

.header, .card, .idx-scroll-container, .table-scroll, .summary, .hist-item, .backup-box { 
  background: var(--bg-card); box-shadow: var(--shadow-soft); border-radius: 12px; transition: background-color 0.4s ease, box-shadow 0.4s ease; border: 1px solid var(--border-light);
}
.header { box-shadow: var(--shadow-strong); border-bottom: 2px solid var(--s-dark); border-radius: 0 0 16px 16px; padding: 12px 10px 4px 10px; display: flex; flex-direction: column; position: sticky; top: 0; z-index: 100; transition: all 0.4s ease; }
.header-top { display: flex; align-items: center; justify-content: space-between; width: 100%; }
.header h1 { font-size: 20px; font-weight: 700; color: var(--t-main); user-select: none; margin-left: 6px; display: flex; align-items: center; gap: 10px; }

.title-text {
  font-size: 22px;
  font-weight: normal;
  color: var(--t-main);
  text-shadow: 
    1px 1px 0px var(--border-light),
    2px 2px 0px var(--s-dark),
    3px 3px 5px rgba(0, 0, 0, 0.15);
}
body.tech .title-text {
  text-shadow: 
    1px 1px 0px #151820,
    2px 2px 0px #0e1015,
    3px 3px 6px rgba(0, 0, 0, 0.6);
}

.glass-bead {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 25%, #ffffff 0%, #ffe066 20%, #f5a623 60%, #b36b00 100%);
  box-shadow: 
    inset -3px -3px 6px rgba(102, 51, 0, 0.5),
    inset 3px 3px 6px rgba(255, 255, 255, 0.8),
    0 4px 6px var(--s-dark);
  color: #7b2c00; 
  text-shadow: 1px 1px 0px rgba(255, 255, 255, 0.5), -1px -1px 0px rgba(0, 0, 0, 0.4);
  font-size: 19px;
  font-weight: bold;
  flex-shrink: 0;
  line-height: 1;
}

.header-top .hdr-right { display: flex; gap: 6px; align-items: center; }

/* ========================================================= 💎 頂部與圓形按鈕 ========================================================= */
.header-top .btn-theme, 
.header-top .btn-adv, 
.header-top .btn-add-hdr { 
  padding: 6px 16px; font-size: 16px !important; font-weight: 800; white-space: nowrap; border-radius: 30px; 
  background: linear-gradient(135deg, var(--s-light) 0%, transparent 100%); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 1px solid var(--border-light);
  box-shadow: inset 0 4px 6px var(--protrude-l), inset 0 -4px 6px var(--protrude-d), 3px 4px 8px var(--s-dark), -2px -2px 6px var(--s-light) !important;
  color: var(--t-main); text-shadow: none !important; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.header-top .btn-add-hdr { color: var(--up); }
.header-top .btn-theme:hover, .header-top .btn-adv:hover, .header-top .btn-add-hdr:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: inset 0 5px 8px var(--protrude-l), inset 0 -3px 5px var(--protrude-d), 5px 6px 12px var(--s-dark), -3px -3px 8px var(--s-light) !important; }
.header-top .btn-theme:active, .header-top .btn-adv:active, .header-top .btn-add-hdr:active { transform: translateY(1px); filter: brightness(0.95); box-shadow: inset 0 3px 6px var(--protrude-d), inset 0 -2px 4px var(--protrude-l), 1px 2px 3px var(--s-dark) !important; }

.btn-glass-circle { width: 28px !important; height: 28px !important; padding: 0 !important; border-radius: 50% !important; display: flex; align-items: center; justify-content: center; font-size: 14px !important; font-weight: 800; background: linear-gradient(135deg, var(--s-light) 0%, transparent 100%); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: 1px solid var(--border-light) !important; box-shadow: inset 0 3px 5px var(--protrude-l), inset 0 -3px 5px var(--protrude-d), 2px 3px 5px var(--s-dark), -1px -1px 3px var(--s-light) !important; text-shadow: none !important; transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; flex-shrink: 0; }
.btn-glass-circle.del { color: var(--up) !important; }
.btn-glass-circle.edit { color: var(--accent) !important; }
.btn-glass-circle:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: inset 0 4px 6px var(--protrude-l), inset 0 -2px 4px var(--protrude-d), 3px 4px 8px var(--s-dark), -2px -2px 6px var(--s-light) !important; }
.btn-glass-circle:active { transform: translateY(1px); filter: brightness(0.95); box-shadow: inset 0 2px 4px var(--protrude-d), inset 0 -1px 2px var(--protrude-l), 1px 1px 2px var(--s-dark) !important; }

.news-ticker-container { margin: 6px 0 0 0; width: 100%; box-sizing: border-box; background: transparent; border-radius: 6px; box-shadow: none; border: none; display: flex; align-items: center; height: 42px; overflow: hidden; transition: all 0.4s ease; }
.ticker-scroll-area { flex: 1; overflow: hidden; position: relative; }
.ticker-wrap { display: inline-block; white-space: nowrap; padding-left: 100%; animation: ticker linear infinite; }
.ticker-item { 
  display: inline-block; 
  padding: 0 20px; 
  color: var(--accent); 
  text-decoration: none; 
  font-weight: 700; 
  font-size: 17px; 
  transition: all 0.3s ease;
}
.ticker-item:hover { 
  text-decoration: underline; 
  transform: translateY(-2px);
}
.ticker-source { color: var(--t-muted); font-size: 13px; margin-right: 6px; border: 1px solid var(--border-light); padding: 2px 4px; border-radius: 4px; text-shadow: none; }
@keyframes ticker { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }

.card { padding: 12px 16px; margin: 6px 10px; }
.card-title { font-size: 16px; color: var(--t-muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; text-align: left; }
.form-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.form-row:last-child { margin-bottom: 0; }

input, select { flex: 1; min-width: 0; padding: 12px; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 8px; box-shadow: var(--shadow-inset); color: var(--t-main); font-weight: 600; text-align: left; text-shadow: -1px -1px 1px var(--protrude-l), 1px 1px 1px var(--protrude-d); transition: background-color 0.4s ease, box-shadow 0.4s ease; }
input::placeholder { color: var(--t-muted); text-shadow: none; font-weight: normal; }
.form-row select { flex: 0 0 68px; padding: 12px 4px; text-align: center; }
.form-row .sym-inp { flex: 0 0 90px; }

button:not(.btn-theme):not(.btn-adv):not(.btn-add-hdr):not(.btn-glass-circle) { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 8px; padding: 10px 16px; box-shadow: var(--shadow-soft); color: var(--t-main); font-weight: 600; cursor: pointer; transition: all 0.25s ease; text-shadow: 1px 1px 1px var(--engrave-l), -1px -1px 1px var(--engrave-d); display: flex; align-items: center; justify-content: center; }
button:not(.btn-theme):not(.btn-adv):not(.btn-add-hdr):not(.btn-glass-circle):hover { transform: translateY(-1px); box-shadow: var(--shadow-strong); }
button:not(.btn-theme):not(.btn-adv):not(.btn-add-hdr):not(.btn-glass-circle):active { transform: translateY(0); box-shadow: var(--shadow-inset); color: var(--accent); border-color: var(--accent); }
.form-row button { font-size: 16px; letter-spacing: 2px; padding-left: 18px; }
.btn-save { width: calc(100% - 20px); padding: 14px; font-size: 17px; margin: 6px 10px; }

/* ========================================================= ⚡ 閃爍動畫樣式 ========================================================= */
.price {
  border-radius: 4px;
  padding: 2px 4px;
  transition: background-color 0.4s ease, color 0.4s ease;
}
.flash-up {
  background-color: rgba(220, 38, 38, 0.25) !important;
  color: var(--up) !important;
}
.flash-down {
  background-color: rgba(22, 163, 74, 0.25) !important;
  color: var(--down) !important;
}

/* 漲跌停專用樣式（覆蓋原有顏色） */
.price.limit-up {
  background-color: #dc2626 !important;
  color: white !important;
}
.price.limit-down {
  background-color: #16a34a !important;
  color: white !important;
}

/* ========================================================= 📂 經典立體漸層頁籤模式 ========================================================= */
.tabs-bar { display: flex; padding: 0 8px; margin: 6px 10px 0; gap: 4px; align-items: flex-end; }
.tab-btn { flex: 1; height: 36px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: linear-gradient(to bottom, var(--s-light) 0%, var(--bg) 100%); color: var(--t-muted); font-weight: 600; cursor: pointer; position: relative; top: 1px; z-index: 1; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-light); border-radius: 8px 8px 0 0; box-shadow: inset 0 2px 2px var(--protrude-l); opacity: 0.5; transition: color 0.2s, filter 0.2s, opacity 0.3s; }
.tab-btn:hover { color: var(--t-main); filter: brightness(1.05); opacity: 0.85; }
.tab-btn.active { background: var(--bg-card); color: var(--accent); font-weight: 800; height: 36px; z-index: 3; border-bottom: 2px solid var(--bg-card); box-shadow: none; opacity: 1; }

/* ========================================================= 📈 指數滑動卡片區調整 ========================================================= */
.idx-scroll-container { margin: 6px 10px; overflow-x: auto; display: flex; gap: 0; padding: 6px 0; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
.idx-scroll-container::-webkit-scrollbar { height: 0; }

.idx-card-box { 
  flex: 0 0 auto; 
  min-width: 180px;
  padding: 6px 12px; 
  scroll-snap-align: start; 
  border-right: 1px solid var(--s-dark); 
  text-align: left; 
  user-select: none;
  transition: transform 0.2s, opacity 0.2s;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.idx-card-box.draggable-card { cursor: grab; }
.idx-card-box.draggable-card:active { cursor: grabbing; }
.idx-card-box.dragging { opacity: 0.4; transform: scale(0.95); }
.idx-card-box.drag-over { border-left: 3px solid var(--accent); }
.idx-card-box:last-child { border-right: none; }

/* 一級標題：增大至 17px */
.idx-box-name { font-size: 17px; color: var(--t-muted); font-weight: 700; line-height: 1.2; margin-bottom: 2px; } 

/* 二級與三級列容器 (數字向右靠) */
.idx-data-row {
  display: flex;
  align-items: baseline;
  justify-content: flex-end; 
  gap: 8px;
  margin-top: 1px;
}

/* 數據與標籤排版 */
.idx-box-price-wrap { display: flex; align-items: baseline; gap: 6px; }
.idx-box-price { font-size: 17px; font-weight: 800; color: var(--t-main); text-shadow: -1px -1px 1px var(--protrude-l), 1px 1px 1px var(--protrude-d); } 
.idx-box-change-row { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; white-space: nowrap; }
.idx-box-vol { font-size: 15px; color: var(--t-main); font-weight: 800; white-space: nowrap; } 
.idx-box-src { font-size: 11px; color: var(--t-muted); text-align: right; margin-top: 2px; opacity: 0.7; }

/* ========================================================= 📈 內容區塊排版與 Grid 調整 ========================================================= */
.table-scroll { margin: 0 10px 6px; overflow-x: auto; padding: 0; -webkit-overflow-scrolling: touch; border-top-left-radius: 0; border-top-right-radius: 0; position: relative; z-index: 2; }

.list-wrap { min-width: 680px; transition: min-width 0.3s ease; }

.list-header, .srow { grid-template-columns: 110px 105px 125px 110px 110px 125px 80px; transition: grid-template-columns 0.3s ease; } 

body.show-hist .list-wrap { min-width: 1100px; }
body.show-hist .list-header, body.show-hist .srow { grid-template-columns: 110px 105px 125px 110px 110px 125px 84px 84px 84px 84px 80px; }

.hist-col { display: none !important; }
body.show-hist .hist-col { display: flex !important; }

.list-header { display: grid; align-items: stretch; border-bottom: 2px solid var(--s-dark); font-size: 17px; color: var(--t-muted); font-weight: 600; }
.srow { display: grid; align-items: stretch; border-bottom: 1px solid var(--s-dark); font-size: 17px; }
.srow:last-child { border-bottom: none; }
.list-header > div, .srow > div { padding: 6px 4px; display: flex; flex-direction: column; justify-content: center; align-items: flex-end; text-align: right; white-space: nowrap; } 
.list-header > div:nth-child(1), .srow > div:nth-child(1) { align-items: flex-start; text-align: left; position: sticky; left: 0; z-index: 2; background: var(--bg-card); padding-left: 8px; }
.list-header > div:nth-child(1)::after, .srow > div:nth-child(1)::after { content: ''; position: absolute; top: 0; bottom: 0; right: -6px; width: 6px; background: linear-gradient(to right, var(--s-dark), transparent); opacity: 0.3; pointer-events: none; }

.list-header > div:nth-child(6), .srow > div:nth-child(6) { align-items: flex-end; text-align: right; padding-right: 4px; }
.list-header > div:last-child { align-items: center; justify-content: center; padding-left: 4px; }
.srow > div:last-child { flex-direction: row; align-items: center; justify-content: center; gap: 8px; padding-left: 4px; }

.sym-container { align-items: flex-start !important; line-height: 1.1 !important; width: 100%; max-width: 112px; display: flex; flex-direction: column; justify-content: center; }

.srow .sym { font-weight: 800; font-size: 17px; color: var(--t-main); text-shadow: -1px -1px 1px var(--protrude-l), 1px 1px 1px var(--protrude-d); cursor: pointer; }
.qty-main { line-height: 1.2; font-size: 17px; font-weight: 800; }

.qty-sub { font-size: 15.6px; color: var(--t-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }

.price-container { width: 100%; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; line-height: 1.2; }
.srow .price { font-weight: 800; font-size: 17px; display: inline-flex; align-items: center; gap: 4px; }

.price-sub { font-size: 15.6px; color: var(--t-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: right; font-weight: 800; }

.change-container { width: 100%; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; line-height: 1.2; }
.srow .chg { font-weight: 800; font-size: 17px; }

.change-sub { font-size: 15.6px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: right; font-weight: 800; }

.srow .today-pnl { font-weight: 800; font-size: 17px; }
.srow .qty-cell, .srow .total { width: 100%; }

.total-main { line-height: 1.2; font-size: 17px; width: 100%; overflow: hidden; text-align: right; font-weight: 800; }

.total-sub { font-size: 15.6px; opacity: 0.85; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-align: right; font-weight: 800; }

.sym-name { font-size: 12px; color: var(--t-muted); margin-top: 4px; font-weight: normal; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
.total-sub.neutral { opacity: 0.6; font-weight: 800; }

.summary { padding: 12px 16px; margin: 6px 10px; }
.sum-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
.sum-row .lab { color: var(--t-muted); font-size: 17px; font-weight: 600; text-shadow: 1px 1px 1px var(--engrave-l), -1px -1px 1px var(--engrave-d); }
.sum-row .val { font-size: 18px; font-weight: 800; text-shadow: -1px -1px 1px var(--protrude-l), 1px 1px 1px var(--protrude-d); }

.sum-divider { height: 2px; background: var(--s-dark); opacity: 0.5; margin: 6px 0; border-radius: 2px; }
