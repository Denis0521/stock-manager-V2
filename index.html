<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股及全球指數即時看板</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            stockUp: '#ef4444',   // 漲：紅
            stockDown: '#10b981' // 跌：綠
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen font-sans antialiased transition-colors duration-200">

  <!-- 頂部跑馬燈：國際指數 & 財經新聞 -->
  <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 text-sm sticky top-0 z-30 shadow-md transition-colors">
    <div class="max-w-7xl mx-auto px-4 py-2 flex flex-col md:flex-row items-center justify-between gap-2">
      <!-- 國際指數輪播區 -->
      <div id="foreignIndicesBar" class="flex items-center space-x-4 overflow-x-auto no-scrollbar w-full md:w-auto py-1">
        <div class="text-xs text-gray-500 dark:text-gray-400 whitespace-nowrap"><i class="fa-solid fa-globe mr-1"></i>全球重點:</div>
        <div id="foreignIndicesList" class="flex space-x-4 whitespace-nowrap text-xs">
          <span class="text-gray-400">載入中...</span>
        </div>
      </div>
      <!-- 快速功能按鈕 -->
      <div class="flex items-center space-x-2 shrink-0">
        <button id="btnManageForeign" class="text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 px-2 py-1 rounded border border-gray-300 dark:border-gray-600 transition">
          <i class="fa-solid fa-gear mr-1"></i>指數設定
        </button>
        <button id="themeToggleBtn" class="text-xs bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 p-1.5 rounded-full border border-gray-300 dark:border-gray-600 transition">
          <i class="fa-solid fa-sun text-amber-500 dark:text-amber-400"></i>
        </button>
      </div>
    </div>
    <!-- 財經新聞快訊跑馬燈 -->
    <div class="bg-gray-50 dark:bg-gray-950 px-4 py-1.5 border-t border-gray-200 dark:border-gray-800 text-xs flex items-center overflow-hidden">
      <span class="bg-red-600 text-white font-bold px-1.5 py-0.5 rounded mr-2 shrink-0 text-[10px]">新聞</span>
      <div class="overflow-hidden relative w-full h-5">
        <div id="newsTicker" class="absolute whitespace-nowrap transition-transform duration-500 ease-in-out cursor-pointer hover:underline text-gray-700 dark:text-gray-300">
          載入即時財經新聞中...
        </div>
      </div>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-7xl mx-auto px-4 py-6">
    <!-- 狀態列與控制按鈕 -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold flex items-center gap-2 text-gray-900 dark:text-white">
          <i class="fa-solid fa-chart-line text-blue-500"></i> 台股與持股即時看板
        </h1>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 flex items-center gap-2">
          <span>最後更新: <span id="lastUpdated">--:--:--</span></span>
          <span id="statusBadge" class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[10px] bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 dark:bg-emerald-400 mr-1 animate-pulse"></span>運作中
          </span>
        </p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button id="btnAddStock" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-sm font-medium transition shadow flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> 新增股票
        </button>
        <button id="btnManualTrans" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded text-sm font-medium transition shadow flex items-center gap-1">
          <i class="fa-solid fa-wallet"></i> 新增交易
        </button>
        <button id="btnViewTransHistory" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded text-sm font-medium transition shadow flex items-center gap-1">
          <i class="fa-solid fa-list-check"></i> 交易明細
        </button>
        <button id="btnSettings" class="bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 px-3 py-1.5 rounded text-sm font-medium transition flex items-center gap-1">
          <i class="fa-solid fa-sliders"></i> 設定與備份
        </button>
      </div>
    </div>

    <!-- 投資組合總覽卡片 -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
      <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm transition-colors">
        <div class="text-xs text-gray-500 dark:text-gray-400 mb-1">總市值 (TWD)</div>
        <div id="summaryTotalMarketValue" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm transition-colors">
        <div class="text-xs text-gray-500 dark:text-gray-400 mb-1">總投資成本 (TWD)</div>
        <div id="summaryTotalCost" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm transition-colors">
        <div class="text-xs text-gray-500 dark:text-gray-400 mb-1">未實現損益</div>
        <div id="summaryUnrealizedProfit" class="text-2xl font-bold">0</div>
      </div>
      <div class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm transition-colors">
        <div class="text-xs text-gray-500 dark:text-gray-400 mb-1">預估投資報酬率</div>
        <div id="summaryROI" class="text-2xl font-bold">0.00%</div>
      </div>
    </section>

    <!-- 股票清單表格 -->
    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-lg overflow-hidden transition-colors">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-gray-50 dark:bg-gray-900/60 text-gray-600 dark:text-gray-400 text-xs uppercase border-b border-gray-200 dark:border-gray-700">
            <tr>
              <th class="py-3 px-4">代號/名稱</th>
              <th class="py-3 px-4 text-right">成交價</th>
              <th class="py-3 px-4 text-right">漲跌</th>
              <th class="py-3 px-4 text-right">漲跌幅</th>
              <th class="py-3 px-4 text-right">持有股數</th>
              <th class="py-3 px-4 text-right">均價</th>
              <th class="py-3 px-4 text-right">未實現損益</th>
              <th class="py-3 px-4 text-center">走勢/操作</th>
            </tr>
          </thead>
          <tbody id="stockTableBody" class="divide-y divide-gray-200 dark:divide-gray-700/50">
            <tr>
              <td colspan="8" class="text-center py-8 text-gray-400">載入追蹤清單中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- 彈出視窗 1：新增自訂追蹤股票 -->
  <div id="addModalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">新增追蹤股票</h3>
        <button onclick="closeModalById('addModalOverlay')" class="text-gray-400 hover:text-gray-600 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">股票代號 (如 2330, 0050)</label>
          <input type="text" id="inputStockSymbol" placeholder="例如: 2330" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">自訂名稱 (選填)</label>
          <input type="text" id="inputStockName" placeholder="例如: 台積電" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <div class="mt-6 flex justify-end space-x-2">
        <button onclick="closeModalById('addModalOverlay')" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded text-sm">取消</button>
        <button id="btnConfirmAddStock" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm font-medium">新增</button>
      </div>
    </div>
  </div>

  <!-- 彈出視窗 2：手動記帳交易紀錄 -->
  <div id="manualOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">新增交易記帳</h3>
        <button onclick="closeModalById('manualOverlay')" class="text-gray-400 hover:text-gray-600 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-3">
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">選擇股票</label>
          <select id="selectTransSymbol" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">交易類型</label>
          <select id="selectTransType" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
            <option value="BUY">買入 (Buy)</option>
            <option value="SELL">賣出 (Sell)</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">成交價格 (TWD)</label>
          <input type="number" step="0.01" id="inputTransPrice" placeholder="0.00" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">交易股數</label>
          <input type="number" id="inputTransShares" placeholder="1000" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">交易日期</label>
          <input type="date" id="inputTransDate" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <div class="mt-6 flex justify-end space-x-2">
        <button onclick="closeModalById('manualOverlay')" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded text-sm">取消</button>
        <button id="btnSaveTransaction" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-sm font-medium">儲存紀錄</button>
      </div>
    </div>
  </div>

  <!-- 彈出視窗 3：歷史交易紀錄清單 (新增) -->
  <div id="transHistoryOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 w-full max-w-2xl shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">交易歷史明細</h3>
        <button onclick="closeModalById('transHistoryOverlay')" class="text-gray-400 hover:text-gray-600 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="max-h-80 overflow-y-auto">
        <table class="w-full text-left text-xs">
          <thead class="bg-gray-100 dark:bg-gray-900 text-gray-500 dark:text-gray-400">
            <tr>
              <th class="p-2">日期</th>
              <th class="p-2">股票</th>
              <th class="p-2">類別</th>
              <th class="p-2 text-right">單價</th>
              <th class="p-2 text-right">股數</th>
              <th class="p-2 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="transHistoryTableBody" class="divide-y divide-gray-200 dark:divide-gray-700">
          </tbody>
        </table>
      </div>
      <div class="mt-4 flex justify-end">
        <button onclick="closeModalById('transHistoryOverlay')" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded text-sm">關閉</button>
      </div>
    </div>
  </div>

  <!-- 彈出視窗 4：進階設定與資料備份/復原 -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">進階設定與資料備份</h3>
        <button onclick="closeModalById('modalOverlay')" class="text-gray-400 hover:text-gray-600 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Fugle API Key (優先即時數據)</label>
          <input type="password" id="inputFugleKey" placeholder="輸入 Fugle API Key" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">輪詢間隔 (秒)</label>
          <input type="number" id="inputIntervalSec" min="3" max="60" value="10" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
        <hr class="border-gray-200 dark:border-gray-700">
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-2">資料管理</label>
          <div class="flex gap-2">
            <button id="btnExportData" class="w-1/2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-xs py-2 rounded font-medium">
              <i class="fa-solid fa-download mr-1"></i>匯出 JSON
            </button>
            <button id="btnImportData" class="w-1/2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 text-xs py-2 rounded font-medium">
              <i class="fa-solid fa-upload mr-1"></i>匯入 JSON
            </button>
            <input type="file" id="inputImportFile" accept=".json" class="hidden">
          </div>
        </div>
      </div>
      <div class="mt-6 flex justify-end space-x-2">
        <button onclick="closeModalById('modalOverlay')" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded text-sm">取消</button>
        <button id="btnSaveSettings" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm font-medium">儲存設定</button>
      </div>
    </div>
  </div>

  <!-- 彈出視窗 5：編輯個股庫存 -->
  <div id="editModalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold" id="editModalTitle">修改持股資料</h3>
        <button onclick="closeModalById('editModalOverlay')" class="text-gray-400 hover:text-gray-600 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <input type="hidden" id="editStockSymbol">
      <div class="space-y-4">
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">持有股數</label>
          <input type="number" id="editStockShares" placeholder="0" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">平均買入成本 (TWD)</label>
          <input type="number" step="0.01" id="editStockCost" placeholder="0.00" class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-700 rounded px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <div class="mt-6 flex justify-end space-x-2">
        <button onclick="closeModalById('editModalOverlay')" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 rounded text-sm">取消</button>
        <button id="btnSaveEditStock" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm font-medium">更新持股</button>
      </div>
    </div>
  </div>

  <!-- 彈出視窗 6：全球指數管理 -->
  <div id="foreignIdxOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 w-full max-w-md shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold">全球重點指數追蹤管理</h3>
        <button onclick="closeModalById('foreignIdxOverlay')" class="text-gray-400 hover:text-gray-600 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="space-y-3 max-h-60 overflow-y-auto pr-2" id="foreignIdxListManage">
      </div>
      <div class="mt-6 flex justify-end">
        <button onclick="closeModalById('foreignIdxOverlay')" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-sm font-medium">完成</button>
      </div>
    </div>
  </div>

  <!-- 彈出視窗 7：歷史走勢圖表 Modal -->
  <div id="historyModalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-6 w-full max-w-3xl shadow-2xl">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold flex items-center gap-2" id="historyModalTitle">
          <i class="fa-solid fa-chart-area text-blue-500"></i> 歷史走勢圖
        </h3>
        <button onclick="closeModalById('historyModalOverlay')" class="text-gray-400 hover:text-gray-600 dark:hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="w-full h-72 relative">
        <canvas id="historyChart"></canvas>
      </div>
    </div>
  </div>

  <!-- 核心 JavaScript 邏輯 -->
  <script>
    const $ = id => document.getElementById(id);
    const escapeHTML = str => String(str).replace(/[&<>"']/g, match => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[match]);

    const DEFAULT_FOREIGN_INDICES = [
      { symbol: '^TWII', name: '加權指數', active: true },
      { symbol: '^GSPC', name: '標普500', active: true },
      { symbol: '^IXIC', name: '那斯達克', active: true },
      { symbol: '^DJI', name: '道瓊工業', active: true },
      { symbol: '^SOX', name: '費城半導體', active: true },
      { symbol: '^N225', name: '日經225', active: true }
    ];

    const DEFAULT_STOCKS = [
      { symbol: '2330', name: '台積電', shares: 1000, cost: 580 },
      { symbol: '0050', name: '元大台灣50', shares: 2000, cost: 130 }
    ];

    let state = {
      stocks: JSON.parse(localStorage.getItem('tw_stocks_data')) || DEFAULT_STOCKS,
      foreignIndices: JSON.parse(localStorage.getItem('foreign_indices_config')) || DEFAULT_FOREIGN_INDICES,
      fugleApiKey: localStorage.getItem('fugle_api_key') || '',
      pollingInterval: parseInt(localStorage.getItem('polling_interval')) || 10,
      stockQuotes: {},
      transactions: JSON.parse(localStorage.getItem('tw_stock_trans')) || [],
      newsList: [],
      currentNewsIdx: 0,
      chartInstance: null
    };

    const PROXY_LIST = [
      url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`
    ];

    // Inline Web Worker 輪詢
    const workerBlob = new Blob([`
      let timer = null;
      self.onmessage = function(e) {
        if (e.data.action === 'start') {
          if (timer) clearInterval(timer);
          timer = setInterval(() => self.postMessage({ type: 'TICK' }), e.data.interval * 1000);
        } else if (e.data.action === 'stop') {
          if (timer) clearInterval(timer);
        }
      };
    `], { type: 'application/javascript' });

    const worker = new Worker(URL.createObjectURL(workerBlob));
    worker.onmessage = function(e) {
      if (e.data.type === 'TICK') {
        fetchQuotes();
        fetchForeignIndices();
      }
    };

    function startWorker() {
      worker.postMessage({ action: 'start', interval: state.pollingInterval });
    }

    // 抓取即時報價
    async function fetchQuotes() {
      const symbols = state.stocks.map(s => s.symbol);
      if (symbols.length === 0) return;

      const updatedQuotes = { ...state.stockQuotes };

      for (const symbol of symbols) {
        let quoteFetched = false;

        if (state.fugleApiKey) {
          try {
            const res = await fetch(`https://api.fugle.tw/marketdata/v1.0/stock/historical/candles/${symbol}?fields=close,change,open,high,low,volume`, {
              headers: { 'X-API-KEY': state.fugleApiKey }
            });
            if (res.ok) {
              const data = await res.json();
              if (data && data.candles && data.candles.length > 0) {
                const latest = data.candles[0];
                const prevClose = latest.close - latest.change;
                updatedQuotes[symbol] = {
                  price: latest.close,
                  change: latest.change,
                  changePercent: (latest.change / prevClose) * 100
                };
                quoteFetched = true;
              }
            }
          } catch (err) {}
        }

        if (!quoteFetched) {
          const yahooSymbol = symbol.endsWith('.TW') || symbol.endsWith('.TWO') ? symbol : `${symbol}.TW`;
          const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${yahooSymbol}?interval=1m&range=1d`;
          
          for (const proxyFn of PROXY_LIST) {
            try {
              const res = await fetch(proxyFn(targetUrl));
              if (res.ok) {
                const data = await res.json();
                const meta = data.chart.result[0].meta;
                const currentPrice = meta.regularMarketPrice;
                const prevClose = meta.chartPreviousClose || meta.previousClose;
                const change = currentPrice - prevClose;
                
                updatedQuotes[symbol] = {
                  price: currentPrice,
                  change: change,
                  changePercent: (change / prevClose) * 100
                };
                quoteFetched = true;
                break;
              }
            } catch (e) {}
          }
        }
      }

      state.stockQuotes = updatedQuotes;
      $('lastUpdated').textContent = new Date().toLocaleTimeString();
      renderStockTable();
      renderSummary();
    }

    // 抓取全球指數
    async function fetchForeignIndices() {
      const activeIndices = state.foreignIndices.filter(i => i.active);
      const container = $('foreignIndicesList');
      if (activeIndices.length === 0) {
        container.innerHTML = `<span class="text-gray-400">無啟用指數</span>`;
        return;
      }

      let html = '';
      for (const idx of activeIndices) {
        try {
          const res = await fetch(`https://yahoo-index-proxy.denis0521.workers.dev/?symbol=${encodeURIComponent(idx.symbol)}`);
          if (res.ok) {
            const data = await res.json();
            const colorClass = data.change >= 0 ? 'text-stockUp' : 'text-stockDown';
            const sign = data.change >= 0 ? '+' : '';
            html += `<div class="flex items-center space-x-1 border-r border-gray-300 dark:border-gray-700 pr-3">
              <span class="text-gray-600 dark:text-gray-300 font-medium">${escapeHTML(idx.name)}:</span>
              <span class="font-bold">${data.price.toFixed(2)}</span>
              <span class="${colorClass} text-[11px]">${sign}${data.changePercent.toFixed(2)}%</span>
            </div>`;
          }
        } catch (e) {
          html += `<div class="flex items-center space-x-1 border-r border-gray-300 dark:border-gray-700 pr-3">
            <span class="text-gray-600 dark:text-gray-300 font-medium">${escapeHTML(idx.name)}:</span>
            <span class="text-gray-400">--</span>
          </div>`;
        }
      }
      container.innerHTML = html;
    }

    // 新聞滾動
    async function fetchNews() {
      try {
        const res = await fetch('https://finance-news-api.denis0521.workers.dev/');
        if (res.ok) {
          const news = await res.json();
          if (Array.isArray(news) && news.length > 0) {
            state.newsList = news;
            rotateNews();
          }
        }
      } catch (err) {}
    }

    function rotateNews() {
      if (state.newsList.length === 0) return;
      const ticker = $('newsTicker');
      const item = state.newsList[state.currentNewsIdx];
      ticker.textContent = `[${escapeHTML(item.source || '財經')}] ${escapeHTML(item.title)}`;
      ticker.onclick = () => { if(item.link) window.open(item.link, '_blank'); };
      state.currentNewsIdx = (state.currentNewsIdx + 1) % state.newsList.length;
      setTimeout(rotateNews, 6000);
    }

    // 渲染股票表格
    function renderStockTable() {
      const tbody = $('stockTableBody');
      if (state.stocks.length === 0) {
        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-gray-400">目前尚無追蹤股票。</td></tr>`;
        return;
      }

      let html = '';
      state.stocks.forEach(stock => {
        const quote = state.stockQuotes[stock.symbol] || {};
        const price = quote.price !== undefined ? quote.price : null;
        const change = quote.change || 0;
        const changePercent = quote.changePercent || 0;

        const isUp = change >= 0;
        const textClass = isUp ? 'text-stockUp' : 'text-stockDown';
        const sign = isUp ? '+' : '';

        let profitLossHtml = '<span class="text-gray-400">--</span>';
        if (price && stock.shares && stock.cost) {
          const marketVal = price * stock.shares;
          const totalCost = stock.cost * stock.shares;
          const profit = marketVal - totalCost;
          const profitPercent = (profit / totalCost) * 100;
          const pClass = profit >= 0 ? 'text-stockUp' : 'text-stockDown';
          const pSign = profit >= 0 ? '+' : '';
          profitLossHtml = `<div class="${pClass} font-semibold">${pSign}${Math.round(profit).toLocaleString()}</div>
                            <div class="${pClass} text-[10px]">${pSign}${profitPercent.toFixed(2)}%</div>`;
        }

        html += `<tr class="hover:bg-gray-50 dark:hover:bg-gray-700/40 transition-colors border-b border-gray-200 dark:border-gray-700/30">
          <td class="py-3 px-4">
            <div class="font-bold">${escapeHTML(stock.symbol)}</div>
            <div class="text-xs text-gray-500 dark:text-gray-400">${escapeHTML(stock.name || '--')}</div>
          </td>
          <td class="py-3 px-4 text-right font-semibold">
            ${price !== null ? price.toFixed(2) : '<span class="text-gray-400">更新中</span>'}
          </td>
          <td class="py-3 px-4 text-right ${textClass}">${price !== null ? sign + change.toFixed(2) : '--'}</td>
          <td class="py-3 px-4 text-right ${textClass} font-semibold">${price !== null ? sign + changePercent.toFixed(2) + '%' : '--'}</td>
          <td class="py-3 px-4 text-right">${stock.shares ? stock.shares.toLocaleString() : 0}</td>
          <td class="py-3 px-4 text-right">${stock.cost ? stock.cost.toFixed(2) : '0.00'}</td>
          <td class="py-3 px-4 text-right">${profitLossHtml}</td>
          <td class="py-3 px-4 text-center">
            <div class="flex items-center justify-center space-x-2">
              <button onclick="showHistoryChart('${escapeHTML(stock.symbol)}', '${escapeHTML(stock.name)}')" class="text-blue-500 hover:text-blue-600 p-1"><i class="fa-solid fa-chart-line"></i></button>
              <button onclick="openEditModal('${escapeHTML(stock.symbol)}')" class="text-amber-500 hover:text-amber-600 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
              <button onclick="removeStock('${escapeHTML(stock.symbol)}')" class="text-red-500 hover:text-red-600 p-1"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </td>
        </tr>`;
      });

      tbody.innerHTML = html;
    }

    // 總覽統計
    function renderSummary() {
      let totalMarketValue = 0;
      let totalCost = 0;

      state.stocks.forEach(stock => {
        const quote = state.stockQuotes[stock.symbol];
        if (quote && quote.price && stock.shares && stock.cost) {
          totalMarketValue += quote.price * stock.shares;
          totalCost += stock.cost * stock.shares;
        }
      });

      const totalProfit = totalMarketValue - totalCost;
      const roi = totalCost > 0 ? (totalProfit / totalCost) * 100 : 0;

      $('summaryTotalMarketValue').textContent = Math.round(totalMarketValue).toLocaleString();
      $('summaryTotalCost').textContent = Math.round(totalCost).toLocaleString();
      
      const profitEl = $('summaryUnrealizedProfit');
      const roiEl = $('summaryROI');

      const sign = totalProfit >= 0 ? '+' : '';
      profitEl.textContent = `${sign}${Math.round(totalProfit).toLocaleString()}`;
      profitEl.className = `text-2xl font-bold ${totalProfit >= 0 ? 'text-stockUp' : 'text-stockDown'}`;

      roiEl.textContent = `${sign}${roi.toFixed(2)}%`;
      roiEl.className = `text-2xl font-bold ${totalProfit >= 0 ? 'text-stockUp' : 'text-stockDown'}`;
    }

    // Modal 開關
    function closeModalById(id) { $(id).classList.add('hidden'); }
    function openModalById(id) { $(id).classList.remove('hidden'); }

    // 新增股票
    $('btnAddStock').onclick = () => openModalById('addModalOverlay');
    $('btnConfirmAddStock').onclick = () => {
      const symbol = $('inputStockSymbol').value.trim().toUpperCase();
      const name = $('inputStockName').value.trim();
      if (!symbol) return alert('請輸入股票代號');
      if (state.stocks.some(s => s.symbol === symbol)) return alert('股票已在追蹤清單中！');

      state.stocks.push({ symbol, name, shares: 0, cost: 0 });
      saveStocksState();
      closeModalById('addModalOverlay');
      $('inputStockSymbol').value = '';
      $('inputStockName').value = '';
      fetchQuotes();
    };

    // 刪除股票
    window.removeStock = function(symbol) {
      if (confirm(`確定移除 ${symbol} 嗎？`)) {
        state.stocks = state.stocks.filter(s => s.symbol !== symbol);
        saveStocksState();
        renderStockTable();
        renderSummary();
      }
    };

    // 編輯股票
    window.openEditModal = function(symbol) {
      const stock = state.stocks.find(s => s.symbol === symbol);
      if (!stock) return;
      $('editStockSymbol').value = stock.symbol;
      $('editModalTitle').textContent = `修改 ${stock.symbol} ${stock.name || ''} 持股`;
      $('editStockShares').value = stock.shares || 0;
      $('editStockCost').value = stock.cost || 0;
      openModalById('editModalOverlay');
    };

    $('btnSaveEditStock').onclick = () => {
      const symbol = $('editStockSymbol').value;
      const stock = state.stocks.find(s => s.symbol === symbol);
      if (stock) {
        stock.shares = parseFloat($('editStockShares').value) || 0;
        stock.cost = parseFloat($('editStockCost').value) || 0;
        saveStocksState();
        renderStockTable();
        renderSummary();
      }
      closeModalById('editModalOverlay');
    };

    // 交易記帳
    $('btnManualTrans').onclick = () => {
      const select = $('selectTransSymbol');
      select.innerHTML = state.stocks.map(s => `<option value="${s.symbol}">${s.symbol} ${s.name || ''}</option>`).join('');
      $('inputTransDate').value = new Date().toISOString().split('T')[0];
      openModalById('manualOverlay');
    };

    $('btnSaveTransaction').onclick = () => {
      const symbol = $('selectTransSymbol').value;
      const type = $('selectTransType').value;
      const price = parseFloat($('inputTransPrice').value);
      const shares = parseInt($('inputTransShares').value);
      const date = $('inputTransDate').value;

      if (!symbol || isNaN(price) || isNaN(shares) || shares <= 0) return alert('請填寫正確交易資料');

      state.transactions.push({ symbol, type, price, shares, date });
      localStorage.setItem('tw_stock_trans', JSON.stringify(state.transactions));
      recalculateAllPositions();
      closeModalById('manualOverlay');
    };

    // 交易歷史列表
    $('btnViewTransHistory').onclick = () => {
      renderTransHistory();
      openModalById('transHistoryOverlay');
    };

    function renderTransHistory() {
      const tbody = $('transHistoryTableBody');
      if (state.transactions.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-400">目前無交易明細</td></tr>`;
        return;
      }

      tbody.innerHTML = state.transactions.map((t, idx) => `
        <tr>
          <td class="p-2">${t.date}</td>
          <td class="p-2 font-bold">${t.symbol}</td>
          <td class="p-2 font-bold ${t.type === 'BUY' ? 'text-stockUp' : 'text-stockDown'}">${t.type === 'BUY' ? '買入' : '賣出'}</td>
          <td class="p-2 text-right">${t.price.toFixed(2)}</td>
          <td class="p-2 text-right">${t.shares.toLocaleString()}</td>
          <td class="p-2 text-center">
            <button onclick="deleteTransaction(${idx})" class="text-red-500 hover:underline">刪除</button>
          </td>
        </tr>
      `).join('');
    }

    window.deleteTransaction = function(idx) {
      if (confirm('確定刪除這筆交易紀錄？')) {
        state.transactions.splice(idx, 1);
        localStorage.setItem('tw_stock_trans', JSON.stringify(state.transactions));
        recalculateAllPositions();
        renderTransHistory();
      }
    };

    function recalculateAllPositions() {
      state.stocks.forEach(stock => {
        const symbolTrans = state.transactions.filter(t => t.symbol === stock.symbol);
        let currentShares = 0;
        let totalCost = 0;

        symbolTrans.forEach(t => {
          if (t.type === 'BUY') {
            totalCost += t.price * t.shares;
            currentShares += t.shares;
          } else if (t.type === 'SELL') {
            if (currentShares > 0) {
              const avgCost = totalCost / currentShares;
              currentShares -= t.shares;
              totalCost = currentShares > 0 ? currentShares * avgCost : 0;
            }
          }
        });

        if (symbolTrans.length > 0) {
          stock.shares = currentShares;
          stock.cost = currentShares > 0 ? (totalCost / currentShares) : 0;
        }
      });
      saveStocksState();
      renderStockTable();
      renderSummary();
    }

    // 進階設定與 JSON 備份
    $('btnSettings').onclick = () => {
      $('inputFugleKey').value = state.fugleApiKey;
      $('inputIntervalSec').value = state.pollingInterval;
      openModalById('modalOverlay');
    };

    $('btnSaveSettings').onclick = () => {
      state.fugleApiKey = $('inputFugleKey').value.trim();
      state.pollingInterval = Math.max(3, parseInt($('inputIntervalSec').value) || 10);
      localStorage.setItem('fugle_api_key', state.fugleApiKey);
      localStorage.setItem('polling_interval', state.pollingInterval);
      closeModalById('modalOverlay');
      startWorker();
      fetchQuotes();
    };

    $('btnExportData').onclick = () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `stock_backup_${new Date().toISOString().slice(0,10)}.json`);
      anchor.click();
    };

    $('btnImportData').onclick = () => $('inputImportFile').click();

    $('inputImportFile').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.stocks) state.stocks = imported.stocks;
          if (imported.transactions) state.transactions = imported.transactions;
          if (imported.foreignIndices) state.foreignIndices = imported.foreignIndices;
          saveStocksState();
          localStorage.setItem('tw_stock_trans', JSON.stringify(state.transactions));
          localStorage.setItem('foreign_indices_config', JSON.stringify(state.foreignIndices));
          alert('資料匯入成功！');
          location.reload();
        } catch (err) {
          alert('檔案格式錯誤');
        }
      };
      reader.readAsText(file);
    };

    // 全球指數管理 Modal
    $('btnManageForeign').onclick = () => {
      $('foreignIdxListManage').innerHTML = state.foreignIndices.map((idx, index) => `
        <div class="flex items-center justify-between p-2 bg-gray-50 dark:bg-gray-900/50 rounded">
          <span class="text-sm font-medium">${escapeHTML(idx.name)} (${escapeHTML(idx.symbol)})</span>
          <input type="checkbox" ${idx.active ? 'checked' : ''} onchange="toggleForeignIdx(${index}, this.checked)" class="w-4 h-4 text-blue-600 rounded">
        </div>
      `).join('');
      openModalById('foreignIdxOverlay');
    };

    window.toggleForeignIdx = function(index, checked) {
      state.foreignIndices[index].active = checked;
      localStorage.setItem('foreign_indices_config', JSON.stringify(state.foreignIndices));
      fetchForeignIndices();
    };

    // 歷史 K 線走勢圖
    window.showHistoryChart = async function(symbol, name) {
      $('historyModalTitle').innerHTML = `<i class="fa-solid fa-chart-area text-blue-500"></i> ${escapeHTML(symbol)} ${escapeHTML(name || '')} 近期走勢`;
      openModalById('historyModalOverlay');

      const yahooSymbol = symbol.endsWith('.TW') || symbol.endsWith('.TWO') ? symbol : `${symbol}.TW`;
      const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${yahooSymbol}?interval=1d&range=1mo`;

      let labels = [];
      let prices = [];

      for (const proxyFn of PROXY_LIST) {
        try {
          const res = await fetch(proxyFn(targetUrl));
          if (res.ok) {
            const data = await res.json();
            const result = data.chart.result[0];
            labels = result.timestamp.map(ts => new Date(ts * 1000).toLocaleDateString());
            prices = result.indicators.quote[0].close;
            break;
          }
        } catch (e) {}
      }

      const ctx = $('historyChart').getContext('2d');
      if (state.chartInstance) state.chartInstance.destroy();

      state.chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '收盤價 (TWD)',
            data: prices,
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59, 130, 246, 0.1)',
            fill: true,
            tension: 0.2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(150,150,150,0.1)' } },
            y: { grid: { color: 'rgba(150,150,150,0.1)' } }
          }
        }
      });
    };

    // 主題切換
    $('themeToggleBtn').onclick = () => {
      document.documentElement.classList.toggle('dark');
    };

    function saveStocksState() {
      localStorage.setItem('tw_stocks_data', JSON.stringify(state.stocks));
    }

    function initApp() {
      renderStockTable();
      renderSummary();
      fetchQuotes();
      fetchForeignIndices();
      fetchNews();
      startWorker();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) worker.postMessage({ action: 'stop' });
      else { startWorker(); fetchQuotes(); }
    });

    initApp();

    ['addModalOverlay', 'modalOverlay', 'manualOverlay', 'transHistoryOverlay', 'editModalOverlay', 'foreignIdxOverlay', 'historyModalOverlay'].forEach(id => {
      const el = $(id);
      if (el) el.addEventListener('click', function(e) { if(e.target === this) closeModalById(id); });
    });
  </script>
</body>
</html>
